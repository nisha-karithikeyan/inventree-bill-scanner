[build-system]
# setuptools 77+ understands the SPDX `license` string and `license-files`.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-bill-scanner"
# The version lives in bill_scanner/__init__.py (PLUGIN_VERSION, currently 0.1.0).
dynamic = ["version"]
description = "InvenTree plugin: scan supplier bills with Gemini Vision and turn them into received purchase orders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Only Python 3.12 is tested (locally and in CI).
requires-python = ">=3.12"
authors = [{ name = "Nisha Karthikeyan", email = "nishakarithikeyan@gmail.com" }]
maintainers = [{ name = "Nisha Karthikeyan", email = "nishakarithikeyan@gmail.com" }]
keywords = [
    "inventree",
    "inventreeplugins",
    "inventory",
    "purchase-order",
    "invoice",
    "bill",
    "ocr",
    "gemini",
    "django",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: InvenTree",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: JavaScript",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# Tools for contributors; InvenTree's own requirements are installed separately.
dev = [
    "ruff==0.16.10",
    "coverage>=7",
]

[project.urls]
Homepage = "https://github.com/nisha-karithikeyan/inventree-bill-scanner"
Repository = "https://github.com/nisha-karithikeyan/inventree-bill-scanner"
Issues = "https://github.com/nisha-karithikeyan/inventree-bill-scanner/issues"
Changelog = "https://github.com/nisha-karithikeyan/inventree-bill-scanner/blob/main/CHANGELOG.md"

[project.entry-points."inventree_plugins"]
BillScanner = "bill_scanner.core:BillScannerPlugin"

[tool.setuptools.dynamic]
version = { attr = "bill_scanner.PLUGIN_VERSION" }

[tool.setuptools.packages.find]
include = ["bill_scanner*"]

[tool.setuptools.package-data]
bill_scanner = ["static/**/*", "migrations/*.py"]

[tool.ruff]
# Mirrors InvenTree's own ruff settings so the code reads like core code.
line-length = 88
target-version = "py311"
exclude = ["frontend", ".dev", ".venv"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "PIE", "SIM", "UP", "W"]
ignore = ["D105", "SIM102", "SIM105", "SIM117"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-third-party = ["InvenTree", "common", "company", "order", "part", "plugin", "stock", "users"]
known-first-party = ["bill_scanner"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django", "rest_framework", "djmoney"]

[tool.ruff.lint.per-file-ignores]
"bill_scanner/migrations/*" = ["D", "E501"]
"bill_scanner/tests/*" = ["D102", "E501"]
"dev/*" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
