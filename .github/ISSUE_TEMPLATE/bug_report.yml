name: Bug report
description: Something in the plugin does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Before posting logs or screenshots, remove your Gemini API key and any
        real supplier names, prices or bill images.** Security problems should be
        reported privately: see [SECURITY.md](https://github.com/nisha-karithikeyan/inventree-bill-scanner/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a PDF bill with ...
        2. Open the review panel
        3. Click "Create order and receive"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: inventree-version
    attributes:
      label: InvenTree version
      description: Shown in the InvenTree "About" dialog.
      placeholder: '1.6.0'
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is InvenTree installed?
      options:
        - Docker
        - Package installer
        - Bare metal / from source
        - Other
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Gemini model setting
      placeholder: gemini-3.8-flash

  - type: dropdown
    id: file-type
    attributes:
      label: Bill file type (if relevant)
      options:
        - Not relevant
        - PDF
        - JPEG
        - PNG
        - WebP
        - HEIC / HEIF

  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: >-
        The message shown on the bill, the browser console, or the server and
        worker output. Remove keys and private data first.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: The background worker was running when the problem happened.
        - label: I removed API keys and private bill data from everything above.
          required: true
